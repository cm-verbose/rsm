[package]
name = "rsm"
version = "0.1.0"
edition = "2024"

[features]
png = []

[[bench]]
name = "rsm"
harness = false

[dependencies]
# c2pa = "0.79.5"
cfg-if = "1.0.4"
# kamadak-exif = "0.6.1"
# libdeflater = "1.24.0"
memmap2 = "0.9.8"
page_size = "0.6.0"
# paste = "1.0.15"
# strum = "0.28"
# strum_macros = "0.28"
wasm-bindgen = "0.2.118"

[dev-dependencies]
criterion = { version = "0.8.2", features = ["html_reports"] }
# proptest = "1.4"
# tempfile = "3.10"

[lib]
crate-type = ["cdylib", "rlib"]

[profile.release]
codegen-units = 1
lto = "fat"
panic = "abort"
strip = true
